services:
  db:
    image: postgres:17-alpine
    container_name: quota-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quota}
    ports:
      - "5433:5432"
    volumes:
      - quota-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    container_name: quota-app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-quota}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-quota}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    # Not published — reachable only through the proxy on the internal network

  proxy:
    image: caddy:2-alpine
    container_name: quota-proxy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app

volumes:
  quota-pgdata:
