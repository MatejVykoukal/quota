services:
  db:
    image: postgres:17-alpine
    container_name: quota-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quota}
    ports:
      - "5433:5432"
    volumes:
      - quota-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quota-pgdata:
